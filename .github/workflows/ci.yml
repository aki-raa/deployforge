name: DeployForge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: pip install ansible

      - name: Ansible Syntax Check
        run: ansible-playbook -i ansible/inventory.ini ansible/setup.yml --syntax-check

      - name: Build application image
        run: docker build -t deployforge-app:ci ./app

      - name: Occupy port 8090 (simulate conflict)
        run: docker run -d --name deployforge-port-squatter -p 8090:80 nginx:alpine

      - name: Start application container
        run: docker run -d --name deployforge-ci -p 8090:8080 deployforge-app:ci

      - name: Application health check
        run: |
          sleep 2
          curl --fail http://localhost:8090

      - name: Cleanup application container
        if: always()
        run: |
          docker rm -f deployforge-ci || true
          docker rm -f deployforge-port-squatter || true
