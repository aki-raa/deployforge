- name: Configure DeployForge server
  hosts: servers
  become: true

  vars:
    app_user: deployforge
    app_directory: /opt/deployforge
    nginx_config: deployforge.conf

  tasks:
    - name: Create application user
      user:
        name: "{{ app_user }}"
        shell: /bin/bash
        create_home: true

    - name: Create application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Deploy application script
      copy:
        src: app.sh
        dest: "{{ app_directory }}/app.sh"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: true

    - name: Disable default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Deploy Nginx configuration
      template:
        src: templates/deployforge.conf.j2
        dest: "/etc/nginx/sites-available/{{ nginx_config }}"
        owner: root
        group: root
        mode: "0644"
      notify: Reload Nginx

    - name: Enable DeployForge Nginx site
      file:
        src: "/etc/nginx/sites-available/{{ nginx_config }}"
        dest: "/etc/nginx/sites-enabled/{{ nginx_config }}"
        state: link
      notify: Reload Nginx

    - name: Test Nginx configuration
      command: nginx -t
      changed_when: false

    - name: Check if Nginx is running
      command: pgrep -x nginx
      register: nginx_process
      failed_when: false
      changed_when: false

    - name: Start Nginx
      command: nginx
      when: nginx_process.rc != 0

    - name: Check application health
      uri:
        url: http://localhost
        status_code: 200

  handlers:
    - name: Reload Nginx
      command: nginx -s reload
